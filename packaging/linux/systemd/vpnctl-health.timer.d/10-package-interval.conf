[Timer]
# systemd timer triggers are ADDITIVE across drop-ins: without the empty
# assignments below this drop-in would stack a SECOND set of triggers on top
# of the base unit's and double-fire the health check (Copilot review finding).
OnBootSec=
OnUnitInactiveSec=
OnBootSec=60s
OnUnitInactiveSec=60s
AccuracySec=1s
RandomizedDelaySec=5s
Persistent=false
