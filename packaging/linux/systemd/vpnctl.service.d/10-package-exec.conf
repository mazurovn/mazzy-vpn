[Unit]
Documentation=
Documentation=file:/usr/lib/mazzy-vpn/README.md
Requires=mazzy-vpn-api-recovery.service
After=mazzy-vpn-api-recovery.service
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Type=simple
ExecStart=
ExecStart=/usr/bin/mazzy-vpn _service-run
Restart=always
RestartPreventExitStatus=77
RestartSec=5s
TimeoutStopSec=20s
