[Unit]
Documentation=
Documentation=file:/usr/lib/mazzy-vpn/README.md
# Reset the legacy hard recovery edge. Runtime entrypoints enforce the durable
# recovery gate themselves, so a failed oneshot cannot make systemd reject the
# VPN start job before the engine can report a useful error.
Requires=
After=
Wants=mazzy-vpn-api-recovery.service
After=network-online.target NetworkManager.service mazzy-vpn-api-recovery.service
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Type=simple
ExecStart=
ExecStart=/usr/lib/mazzy-vpn/mazzy-vpn _service-run
Restart=on-failure
RestartPreventExitStatus=77
RestartSec=5s
TimeoutStopSec=20s
