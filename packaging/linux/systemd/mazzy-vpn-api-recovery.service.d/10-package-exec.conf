[Unit]
Documentation=
Documentation=file:/usr/lib/mazzy-vpn/docs/API_CONTRACT.en.md
DefaultDependencies=no
Requires=local-fs.target
After=local-fs.target
Conflicts=shutdown.target
Before=shutdown.target
StartLimitIntervalSec=300
StartLimitBurst=2

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStart=
ExecStart=/usr/lib/mazzy-vpn/mazzy-vpn _api-recover-interrupted-actions
TimeoutStartSec=90s
