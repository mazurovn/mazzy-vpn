[package]
name = "mazzy-vpn-desktop"
version = "0.3.0"
description = "AI-ready, self-healing multi-protocol VPN client and control center"
authors = ["Nik m (@mazurovn)"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/mazurovn/mazzy-vpn"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
