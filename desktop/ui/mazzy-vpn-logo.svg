  <title id="title">Mazzy VPN logo</title>
  <desc id="desc">A violet and cyan shield with an M-shaped encrypted network path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162f"/>
      <stop offset="1" stop-color="#25114a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65e7ff"/>
      <stop offset="0.52" stop-color="#8f7dff"/>
      <stop offset="1" stop-color="#ef70ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="720" rx="160" fill="url(#bg)"/>
  <path d="M360 78 596 166v174c0 143-92 245-236 303C216 585 124 483 124 340V166Z"
        fill="#11152d" stroke="url(#edge)" stroke-width="22"/>
  <path d="M232 468V252l128 131 128-131v216"
        fill="none" stroke="url(#edge)" stroke-width="42"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <g fill="#f8fbff" stroke="#67e6ff" stroke-width="9">
    <circle cx="232" cy="252" r="24"/>
    <circle cx="360" cy="383" r="24"/>
    <circle cx="488" cy="252" r="24"/>
    <circle cx="232" cy="468" r="24"/>
    <circle cx="488" cy="468" r="24"/>
  </g>
  <path d="M310 524h100" stroke="#f8fbff" stroke-width="18" stroke-linecap="round" opacity=".9"/>
</svg>
