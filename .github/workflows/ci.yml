name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck openvpn gitleaks jq

      - name: Bash syntax
        run: |
          bash -n mazzy-vpn vpnctl install.sh tests/run.sh tests/audit-public.sh
          bash -n setup_amnezia_vpn.sh stop_amnezia_vpn.sh
          bash -n completions/mazzy-vpn completions/vpnctl

      - name: ShellCheck
        run: |
          shellcheck mazzy-vpn vpnctl install.sh tests/run.sh tests/audit-public.sh
          shellcheck setup_amnezia_vpn.sh stop_amnezia_vpn.sh
          shellcheck completions/mazzy-vpn completions/vpnctl

      - name: Regression suite
        run: ./tests/run.sh

      - name: Cross-surface release gates
        run: python3 tests/check-capabilities.py

      - name: Versioned local API contract
        run: python3 tests/check-api-contract.py

      - name: Public repository audit
        run: |
          ./tests/audit-public.sh
          gitleaks detect --source . --redact --no-banner

      - name: Staging installer
        run: |
          stage="$(mktemp -d)"
          ./install.sh --destdir "$stage" --no-deps --yes
          test -x "$stage/usr/local/bin/mazzy-vpn"
          test -r "$stage/usr/local/lib/mazzy-vpn/api/v1/manifest.json"
          "$stage/usr/local/bin/mazzy-vpn" api-info --json |
            cmp -s - "$stage/usr/local/lib/mazzy-vpn/api/v1/manifest.json"
          sudo install -m 755 \
            "$stage/usr/local/bin/mazzy-vpn" /usr/local/bin/mazzy-vpn
          systemd-analyze verify \
            "$stage/etc/systemd/system/mazzy-vpn-api.socket" \
            "$stage/etc/systemd/system/mazzy-vpn-api@.service" \
            "$stage/etc/systemd/system/vpnctl.service" \
            "$stage/etc/systemd/system/vpnctl-health.service" \
            "$stage/etc/systemd/system/vpnctl-health.timer" \
            "$stage/etc/systemd/system/vpnctl-test-recovery.service"
