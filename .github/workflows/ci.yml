name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck openvpn gitleaks jq socat

      - name: Bash syntax
        run: |
          bash -n mazzy-vpn vpnctl install.sh \
            packaging/linux/post-install.sh \
            packaging/linux/pre-remove.sh \
            packaging/linux/post-remove.sh \
          tests/run.sh tests/audit-public.sh tests/check-linux-packages.sh \
          tests/check-android-build.sh scripts/install-release-deb.sh \
          scripts/rollback-release-deb.sh scripts/pre-reboot-check.sh
          bash -n setup_amnezia_vpn.sh stop_amnezia_vpn.sh
          bash -n runtime/mazzy-sing-box-adapter
          bash -n completions/mazzy-vpn completions/vpnctl

      - name: ShellCheck
        run: |
          shellcheck mazzy-vpn vpnctl install.sh \
            packaging/linux/post-install.sh \
            packaging/linux/pre-remove.sh \
            packaging/linux/post-remove.sh \
            tests/run.sh tests/audit-public.sh tests/check-linux-packages.sh \
            tests/check-android-build.sh
          shellcheck setup_amnezia_vpn.sh stop_amnezia_vpn.sh
          shellcheck runtime/mazzy-sing-box-adapter
          shellcheck completions/mazzy-vpn completions/vpnctl

      - name: Regression suite
        run: ./tests/run.sh

      - name: Cross-surface release gates
        run: |
          python3 tests/check-capabilities.py
          python3 tests/check-protocol-registry.py
          python3 tests/check-runtime-adapter-registry.py
          python3 tests/check-managed-protocol-adapter.py
          python3 tests/check-agent-control-registry.py

      - name: Versioned local API contract
        run: |
          python3 tests/check-api-contract.py
          python3 tests/check-desktop-ui.py
          python3 tests/check-planner-examples.py

      - name: Android release audit contract
        run: |
          python3 tests/check-android-contract.py
          tests/check-android-build.sh

      - name: Public repository audit
        run: |
          ./tests/audit-public.sh
          gitleaks detect --source . --redact --no-banner --log-opts="--all"

      - name: Staging installer
        run: |
          mkdir -p .mazzy/work/ci-stage
          stage="$(mktemp -d -p .mazzy/work/ci-stage staging.XXXXXX)"
          ./install.sh --destdir "$stage" --no-deps --yes
          test -x "$stage/usr/local/bin/mazzy-vpn"
          test -r "$stage/usr/local/lib/mazzy-vpn/api/v1/manifest.json"
          test -r "$stage/usr/local/lib/mazzy-vpn/protocols/v1/registry.json"
          "$stage/usr/local/bin/mazzy-vpn" api-info --json |
            cmp -s - "$stage/usr/local/lib/mazzy-vpn/api/v1/manifest.json"
          mkdir -p "$stage/usr/lib/systemd/system"
          for target in basic.target local-fs.target multi-user.target \
            network-online.target shutdown.target sockets.target sysinit.target \
            timers.target; do
            printf '[Unit]\nDefaultDependencies=no\n' \
              >"$stage/usr/lib/systemd/system/$target"
          done
          systemd-analyze --root="$stage" --man=no verify \
            mazzy-vpn-api.socket \
            mazzy-vpn-api@internal.service \
            mazzy-vpn-api-recovery.service \
            vpnctl.service \
            vpnctl-health.service \
            vpnctl-health.timer \
            vpnctl-test-recovery.service
