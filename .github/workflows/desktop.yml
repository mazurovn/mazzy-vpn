name: Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint Linux backend
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build platform bundles
        working-directory: desktop
        run: npm run build:release

      - name: Audit Linux package payload and lifecycle
        run: ./tests/check-deb-package.sh

      - name: Upload unsigned preview bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazzy-vpn-desktop-deb
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  preview-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    environment: desktop-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint release backend
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build DEB-only release
        working-directory: desktop
        run: npm run build:release

      - name: Audit Linux package payload and lifecycle
        run: ./tests/check-deb-package.sh
      - name: Create draft DEB release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t debs < <(find desktop/src-tauri/target/release/bundle/deb \
            -maxdepth 1 -type f -name '*.deb' -print)
          ((${#debs[@]} == 1))
          checksum="$GITHUB_WORKSPACE/Mazzy.VPN.Desktop_${RELEASE_TAG#desktop-v}_SHA256SUMS"
          (
            cd "$(dirname "${debs[0]}")"
            sha256sum "$(basename "${debs[0]}")"
          ) >"$checksum"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mazzy VPN Desktop ${RELEASE_TAG#desktop-v} (DEB)" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            "${debs[0]}" \
            "$checksum"
