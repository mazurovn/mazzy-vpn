name: Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            cpio \
            rpm \
            squashfs-tools \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint Linux backend
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build platform bundles
        working-directory: desktop
        run: npm run build:release

      - name: Audit Linux package payload and lifecycle
        if: matrix.platform == 'ubuntu-22.04'
        run: ./tests/check-linux-packages.sh

      - name: Upload unsigned preview bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazzy-vpn-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  preview-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    environment: desktop-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json release asset.
      # Serialize writers so one matrix job cannot overwrite another platform.
      max-parallel: 1
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            cpio \
            rpm \
            squashfs-tools \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint release backend
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and attach preview bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri:audited --
          tagName: desktop-v__VERSION__
          releaseName: "Mazzy VPN Desktop v__VERSION__ (preview)"
          releaseBody: |
            Mazzy VPN Desktop 0.4.1 is a functional Linux control-center preview bundled with the compatible Mazzy VPN 1.4.1 engine. Installable updater artifacts carry a Tauri signature and the application always asks before download or installation.

            The Linux build includes deterministic read-only protocol planning, a 13-protocol catalog, closed managed-profile import for nine modern protocols, a gated sing-box renderer foundation for six, durable local API recovery and a fail-closed dual-stack transition guard. Linux connection lifecycle remains implemented only for AmneziaWG, WireGuard, OpenVPN and L2TP/IPsec; modern protocol render/import support is not advertised as working connect/TUN/DNS/routing/rollback support.

            Agent Control exposes read-only Codex/Claude and transport diagnostics plus versioned future contracts for reverse WSS, LAN WSS, iroh and optional transports. It does not yet provide client-to-client remote control, E2EE sessions, Telegram execution or agent lifecycle authority.

            macOS and Windows bundles are UI previews only and do not protect traffic: Network Extension and Windows Service/Wintun backends are not implemented, and operating-system code signing/notarization remains open. No Android artifact is produced because the repository has no Gradle/VpnService/AAB implementation.

            Review RELEASE_NOTES.md, the source commit and the successful workflow run before use. The Tauri updater signature does not replace Authenticode, Apple notarization or distribution-package repository signatures.
          releaseDraft: true
          prerelease: true

      - name: Audit signed Linux package payload and lifecycle
        if: matrix.platform == 'ubuntu-22.04'
        run: ./tests/check-linux-packages.sh

  publish-update-feed:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    needs: preview-release
    runs-on: ubuntu-22.04
    environment: desktop-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Download and validate signed updater metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir updater-metadata
          mkdir updater-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-metadata
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir updater-assets
          jq -e \
            --arg version "${RELEASE_TAG#desktop-v}" \
            --arg prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
            '
              .version == $version and
              ([.platforms[] | .signature | type == "string" and length > 32] | all) and
              ([.platforms[] | .url | startswith($prefix)] | all) and
              ([.platforms | keys[] | startswith("linux-")] | any) and
              ([.platforms | keys[] | startswith("windows-")] | any) and
              ([.platforms | keys[] | startswith("darwin-")] | any)
            ' updater-metadata/latest.json >/dev/null
          python3 tests/prepare-updater-signature-audit.py >updater-signature-args
          mapfile -d '' -t updater_signature_args <updater-signature-args
          ((${#updater_signature_args[@]} > 0))
          cargo run --locked --quiet \
            --manifest-path desktop/src-tauri/Cargo.toml \
            --example verify-updater-signatures -- \
            desktop/src-tauri/tauri.conf.json \
            "${updater_signature_args[@]}"
          checksums="Mazzy.VPN.Desktop_${RELEASE_TAG#desktop-v}_SHA256SUMS"
          (
            cd updater-assets
            sha256sum -- *
          ) >"updater-metadata/$checksums"

      - name: Publish release and advance fixed update feed
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
          checksums="Mazzy.VPN.Desktop_${RELEASE_TAG#desktop-v}_SHA256SUMS"
          gh release upload "$RELEASE_TAG" "updater-metadata/$checksums" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          if ! gh release view desktop-updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-updater \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mazzy VPN Desktop signed update feed" \
              --notes "Machine-readable signed updater metadata. Install updates only through the consent dialog in Mazzy VPN Desktop." \
              --prerelease
          fi
          gh release upload desktop-updater updater-metadata/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
