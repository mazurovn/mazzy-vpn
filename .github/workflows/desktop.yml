name: Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Test and lint Linux backend
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build platform bundles
        working-directory: desktop
        run: npm run build:release

      - name: Upload unsigned preview bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazzy-vpn-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  preview-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Build and attach preview bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: "Mazzy VPN Desktop v__VERSION__ (preview)"
          releaseBody: |
            Mazzy VPN Desktop 0.2 is a self-contained Linux control-center preview.

            Linux bundles include the compatible Mazzy VPN 1.2 engine installer and public runtime resources; no prior manual CLI installation is required. Dashboard, profile import and selection, validation/probes/transactional tests, complete Doctor/self-test output, bounded logs, service/recovery settings and About/Privacy information are included.

            macOS and Windows bundles remain UI previews only. They do not provide traffic protection until their native Network Extension and Windows Service/Wintun backends pass the platform release gates.

            These preview artifacts are unsigned; review the checksums and project documentation before use.
          releaseDraft: true
          prerelease: true
