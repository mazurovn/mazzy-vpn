name: Desktop

on:
  push:
    branches: [main]
    tags: ["desktop-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            cpio \
            rpm \
            squashfs-tools \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint Linux backend
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build platform bundles
        working-directory: desktop
        run: npm run build:release

      - name: Audit Linux package payload and lifecycle
        if: matrix.platform == 'ubuntu-22.04'
        run: ./tests/check-linux-packages.sh

      - name: Upload unsigned preview bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mazzy-vpn-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  preview-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            cpio \
            rpm \
            squashfs-tools \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy
          rustup default 1.88.0

      - name: Install locked frontend tooling
        working-directory: desktop
        run: npm ci

      - name: Audit frontend dependencies and UI contract
        shell: bash
        run: |
          npm audit --prefix desktop --audit-level=high
          python3 tests/check-desktop-ui.py

      - name: Verify vendored glib soundness backport
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 tests/check-glib-backport.py

      - name: Audit Rust advisories
        if: matrix.platform == 'ubuntu-22.04'
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          rust-version: "1.88.0"
          manifest-path: ./desktop/src-tauri/Cargo.toml
          command: check advisories
          arguments: --all-features

      - name: Test and lint release backend
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          npm run test
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build and attach preview bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri:audited --
          tagName: desktop-v__VERSION__
          releaseName: "Mazzy VPN Desktop v__VERSION__ (preview)"
          releaseBody: |
            Mazzy VPN Desktop 0.3.1 is an AI-ready, bundled-bootstrap Linux control-center preview.

            Linux DEB/RPM bundles install the compatible Mazzy VPN 1.3.1 engine, protected systemd services and base runtime dependencies through the package manager; AppImage retains an explicitly authorized embedded bootstrap. This patch fixes legacy profile-cache compatibility and mixed /usr/local versus package /usr/bin upgrades. Dashboard, profile import and selection, sortable whole-list latency checks, actual egress/location/DNS/IPv6 verification, transactional tests, complete Doctor/self-test output, clickable events, expanded tray, service/recovery settings and About/Privacy information are included.

            A versioned catalog describes 13 protocols and exposes credential-redacted URI detection, runtime diagnostics and the read-only protocols.list API operation. Linux connections remain implemented for AmneziaWG, WireGuard, OpenVPN and L2TP/IPsec. VLESS/REALITY, Hysteria 2, Mieru, NaiveProxy, TUIC v5, Shadowsocks 2022, Trojan, AnyTLS and ShadowTLS v3 remain explicitly planned until their audited runtime/TUN/platform integration gates pass.

            The Linux build vendors the crates.io glib 0.18.5 source with the exact upstream VariantStrIter fix for RUSTSEC-2024-0429 / GHSA-wrw7-89jp-8q8g. CI downloads only the pinned crates.io archive, verifies its checksum and the exact two-line source delta, then cargo-deny audits the remaining dependency graph with no advisory suppressions. event-listener is updated to 5.4.2 for RUSTSEC-2026-0221 and serde_with to 3.21.0 for GHSA-7gcf-g7xr-8hxj.

            macOS and Windows bundles remain UI previews only. They do not provide traffic protection until their native Network Extension and Windows Service/Wintun backends pass the platform release gates.

            These preview artifacts are unsigned and do not have a production trust chain. Review the source commit, workflow run and project documentation before use.
          releaseDraft: true
          prerelease: true
