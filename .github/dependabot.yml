version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    labels: [dependencies, desktop, security]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
    labels: [dependencies, desktop, security]
